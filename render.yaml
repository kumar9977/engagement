# Render deploy config for the backend.
# In Render: New + -> Blueprint -> point it at this repo. Render reads this file.
# You only need to paste your GEMINI_API_KEY (marked sync:false) in the dashboard.
services:
  - type: web
    name: engagement-assistant-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"   # libsql ships a prebuilt native binary for Node 20
      # --- Durable database (Turso). When set, the app stores data in Turso
      # cloud instead of the ephemeral local disk, so users/subscriptions/logs
      # survive restarts and redeploys. Create a free DB at turso.tech, then
      # paste the URL (libsql://...) and an auth token in the dashboard. ---
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL     # text-only fallback if the primary is slow/busy
        value: gemini-2.0-flash
      - key: GEMINI_MAX_TOKENS
        value: "400"
      - key: LLM_TIMEOUT_MS            # with-vision attempt budget
        value: "45000"
      - key: GEMINI_FALLBACK_TIMEOUT_MS # fast text-only attempts
        value: "20000"
      - key: KEEP_WARM                 # self-ping to avoid free-tier cold starts
        value: "true"
      - key: GEMINI_API_KEY
        sync: false          # paste this in the Render dashboard (kept secret)
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten later; the extension origin is chrome-extension://<id>
      # --- Payments (Razorpay) + Admin ---
      - key: PAYMENT_URL
        value: https://rzp.io/rzp/sim9G4s
      - key: SUBSCRIPTION_AMOUNT
        value: "790"
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false          # paste in the Render dashboard; MUST match the Razorpay webhook Secret
      - key: ADMIN_PASSWORD
        sync: false          # paste in the Render dashboard; login for /admin
